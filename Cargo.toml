[package]
name = "douban"
version = "0.1.0"
edition = "2021"
description = "豆瓣电影/剧集信息查询工具（双击即用）"

[[bin]]
name = "douban"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
